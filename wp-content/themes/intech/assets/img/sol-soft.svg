    <radialGradient id="s-g2" cx="100%" cy="90%" r="60%"><stop offset="0" style="stop-color:var(--accent-2);stop-opacity:.45"/><stop offset="1" style="stop-color:var(--accent-2);stop-opacity:0"/></radialGradient>
    <linearGradient id="s-area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--accent);stop-opacity:.45"/><stop offset="1" style="stop-color:var(--accent);stop-opacity:0"/></linearGradient>
    <filter id="s-glow" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="0" stdDeviation="4" style="flood-color:var(--accent)" flood-opacity=".9"/></filter>
