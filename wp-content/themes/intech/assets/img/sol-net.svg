<svg class="art" viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
  <defs>
    <radialGradient id="n-g1" cx="50%" cy="35%" r="55%"><stop offset="0" style="stop-color:var(--accent);stop-opacity:.28"/><stop offset="1" style="stop-color:var(--accent);stop-opacity:0"/></radialGradient>
    <radialGradient id="n-g2" cx="0%" cy="100%" r="60%"><stop offset="0" style="stop-color:var(--accent-2);stop-opacity:.38"/><stop offset="1" style="stop-color:var(--accent-2);stop-opacity:0"/></radialGradient>
    <linearGradient id="n-rack" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16203A"/><stop offset="1" stop-color="#0A1020"/></linearGradient>
    <filter id="n-glow" x="-80%" y="-80%" width="260%" height="260%"><feDropShadow dx="0" dy="0" stdDeviation="3.5" style="flood-color:var(--accent)" flood-opacity=".95"/></filter>
    <filter id="n-gglow" x="-80%" y="-80%" width="260%" height="260%"><feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#34D399" flood-opacity=".9"/></filter>
    <filter id="n-sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000" flood-opacity=".6"/></filter>
    <pattern id="n-grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="rgba(148,178,255,.06)"/></pattern>
  </defs>
  <rect width="640" height="400" class="bg"/>
  <rect width="640" height="400" fill="url(#n-grid)"/>
  <rect width="640" height="400" fill="url(#n-g1)"/>
  <rect width="640" height="400" fill="url(#n-g2)"/>

  <!-- кабели от коммутатора -->
  <g class="stk" fill="none" stroke-width="1.8" opacity=".8">
    <path d="M320 150 C320 120 170 120 150 92"/>
    <path d="M320 150 C320 120 470 120 490 92"/>
    <path d="M300 214 C260 260 170 250 140 290"/>
    <path d="M340 214 C380 260 470 250 500 290"/>
  </g>
  <g filter="url(#n-glow)">
    <circle cx="235" cy="122" r="3.5" class="ac"/>
    <circle cx="405" cy="122" r="3.5" class="ac"/>
    <circle cx="220" cy="254" r="3.5" class="ac"/>
    <circle cx="420" cy="254" r="3.5" class="ac"/>
  </g>

  <!-- точки доступа Wi-Fi -->
  <g transform="translate(110 56)" filter="url(#n-sh)">
    <ellipse cx="40" cy="22" rx="40" ry="16" fill="#E3E9F4"/>
    <ellipse cx="40" cy="18" rx="40" ry="14" fill="#F4F7FC"/>
    <circle cx="40" cy="18" r="4" class="ac" filter="url(#n-glow)"/>
  </g>
  <g transform="translate(150 50)" class="stk" fill="none" stroke-width="2" stroke-linecap="round" filter="url(#n-glow)">
    <path d="M-14 -6 A20 20 0 0 1 14 -6"/>
    <path d="M-26 -16 A36 36 0 0 1 26 -16" opacity=".6"/>
  </g>
  <g transform="translate(450 56)" filter="url(#n-sh)">
    <ellipse cx="40" cy="22" rx="40" ry="16" fill="#E3E9F4"/>
    <ellipse cx="40" cy="18" rx="40" ry="14" fill="#F4F7FC"/>
    <circle cx="40" cy="18" r="4" class="ac" filter="url(#n-glow)"/>
  </g>
  <g transform="translate(490 50)" class="stk" fill="none" stroke-width="2" stroke-linecap="round" filter="url(#n-glow)">
    <path d="M-14 -6 A20 20 0 0 1 14 -6"/>
    <path d="M-26 -16 A36 36 0 0 1 26 -16" opacity=".6"/>
  </g>

  <!-- коммутатор -->
  <g transform="translate(200 150)" filter="url(#n-sh)">
    <rect width="240" height="64" rx="12" fill="url(#n-rack)" stroke="rgba(148,178,255,.22)"/>
    <g transform="translate(18 18)">
      <rect width="18" height="14" rx="2" class="unit"/><rect x="24" width="18" height="14" rx="2" class="unit"/><rect x="48" width="18" height="14" rx="2" class="unit"/><rect x="72" width="18" height="14" rx="2" class="unit"/>
      <rect x="96" width="18" height="14" rx="2" class="unit"/><rect x="120" width="18" height="14" rx="2" class="unit"/><rect x="144" width="18" height="14" rx="2" class="unit"/><rect x="168" width="18" height="14" rx="2" class="unit"/>
      <circle cx="9" cy="22" r="2.5" fill="#34D399" filter="url(#n-gglow)"/><circle cx="33" cy="22" r="2.5" fill="#34D399" filter="url(#n-gglow)"/><circle cx="57" cy="22" r="2.5" class="ac" filter="url(#n-glow)"/><circle cx="81" cy="22" r="2.5" fill="#34D399" filter="url(#n-gglow)"/>
      <circle cx="105" cy="22" r="2.5" class="ac" filter="url(#n-glow)"/><circle cx="129" cy="22" r="2.5" fill="#34D399" filter="url(#n-gglow)"/><circle cx="153" cy="22" r="2.5" fill="#34D399" filter="url(#n-gglow)"/><circle cx="177" cy="22" r="2.5" class="ac" filter="url(#n-glow)"/>
    </g>
    <text x="226" y="22" text-anchor="end" class="t-mono">SW</text>
  </g>

  <!-- рабочие места -->
  <g transform="translate(76 290)" filter="url(#n-sh)">
    <rect width="120" height="74" rx="8" class="glass2"/>
    <rect x="9" y="9" width="102" height="56" rx="4" class="bg"/>
    <rect x="18" y="18" width="34" height="6" rx="3" class="ac"/><rect x="18" y="30" width="80" height="5" rx="2.5" class="ln"/><rect x="18" y="40" width="60" height="5" rx="2.5" class="ln"/>
  </g>
  <g transform="translate(444 290)" filter="url(#n-sh)">
    <rect width="120" height="74" rx="8" class="glass2"/>
    <rect x="9" y="9" width="102" height="56" rx="4" class="bg"/>
    <path d="M20 54 L38 42 L52 46 L68 32 L82 36 L100 22" fill="none" class="stk" stroke-width="2"/>
  </g>

  <!-- статус сети -->
  <g transform="translate(232 300)" filter="url(#n-sh)">
    <rect width="176" height="58" rx="14" class="glass" style="stroke:#34D399;stroke-opacity:.45"/>
    <g transform="translate(16 18)" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round">
      <path d="M0 8 A16 16 0 0 1 24 8"/><path d="M5 14 A9 9 0 0 1 19 14"/><circle cx="12" cy="20" r="1.5" fill="#34D399"/>
    </g>
    <text x="52" y="26" class="t-strong-s">Сеть стабильна</text>
    <text x="52" y="43" class="t-ok">24 устройства</text>
  </g>
</svg>
