<svg class="art" viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
  <defs>
    <radialGradient id="c-g1" cx="30%" cy="30%" r="55%"><stop offset="0" style="stop-color:var(--accent);stop-opacity:.28"/><stop offset="1" style="stop-color:var(--accent);stop-opacity:0"/></radialGradient>
    <radialGradient id="c-g2" cx="100%" cy="100%" r="60%"><stop offset="0" style="stop-color:var(--accent-2);stop-opacity:.4"/><stop offset="1" style="stop-color:var(--accent-2);stop-opacity:0"/></radialGradient>
    <linearGradient id="c-cone" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--accent);stop-opacity:.32"/><stop offset="1" style="stop-color:var(--accent);stop-opacity:0"/></linearGradient>
    <linearGradient id="c-body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E9EEF7"/><stop offset="1" stop-color="#9AA6BC"/></linearGradient>
    <filter id="c-glow" x="-80%" y="-80%" width="260%" height="260%"><feDropShadow dx="0" dy="0" stdDeviation="3.5" style="flood-color:var(--accent)" flood-opacity=".95"/></filter>
    <filter id="c-rglow" x="-80%" y="-80%" width="260%" height="260%"><feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#F43F5E" flood-opacity=".9"/></filter>
    <filter id="c-sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000" flood-opacity=".6"/></filter>
    <pattern id="c-grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="rgba(148,178,255,.06)"/></pattern>
  </defs>
  <rect width="640" height="400" class="bg"/>
  <rect width="640" height="400" fill="url(#c-grid)"/>
  <rect width="640" height="400" fill="url(#c-g1)"/>
  <rect width="640" height="400" fill="url(#c-g2)"/>

  <!-- поле обзора камеры -->
  <path d="M150 112 L330 250 L210 318 Z" fill="url(#c-cone)"/>

  <!-- камера на кронштейне -->
  <g transform="translate(58 58)" filter="url(#c-sh)">
    <rect x="0" y="0" width="16" height="64" rx="4" fill="#5B657A"/>
    <rect x="8" y="22" width="44" height="10" rx="5" fill="#8892A6"/>
    <g transform="translate(40 10) rotate(28)">
      <rect width="96" height="40" rx="12" fill="url(#c-body)"/>
      <rect x="-6" y="-6" width="104" height="10" rx="5" fill="#C9D2E2"/>
      <circle cx="96" cy="20" r="15" fill="#0A1020" stroke="#5B657A" stroke-width="3"/>
      <circle cx="96" cy="20" r="7" class="ac" filter="url(#c-glow)"/>
      <circle cx="20" cy="20" r="3.5" fill="#F43F5E" filter="url(#c-rglow)"/>
    </g>
  </g>

  <!-- линия к регистратору -->
  <g class="stk" fill="none" stroke-width="1.6" stroke-dasharray="5 6" opacity=".75">
    <path d="M74 122 C74 300 200 330 300 330"/>
    <path d="M560 70 C560 40 470 40 440 60"/>
  </g>
  <circle cx="160" cy="318" r="3.5" class="ac" filter="url(#c-glow)"/>

  <!-- монитор с сеткой камер -->
  <g transform="translate(250 58)" filter="url(#c-sh)">
    <rect width="300" height="196" rx="14" class="glass2"/>
    <rect x="12" y="12" width="276" height="160" rx="8" class="bg"/>
    <g transform="translate(20 20)">
      <rect width="126" height="68" rx="5" fill="#111A2E"/>
      <path d="M0 52 L30 34 L52 44 L84 22 L126 40 V68 H0 Z" fill="rgba(148,178,255,.12)"/>
      <rect x="8" y="8" width="38" height="12" rx="3" fill="rgba(0,0,0,.5)"/><text x="12" y="17" class="t-mono">CAM 01</text>
      <circle cx="116" cy="12" r="3" fill="#F43F5E" filter="url(#c-rglow)"/>

      <rect x="134" width="126" height="68" rx="5" fill="#111A2E"/>
      <rect x="150" y="22" width="34" height="40" rx="3" fill="rgba(148,178,255,.12)"/><rect x="196" y="30" width="48" height="32" rx="3" fill="rgba(148,178,255,.1)"/>
      <rect x="142" y="8" width="38" height="12" rx="3" fill="rgba(0,0,0,.5)"/><text x="146" y="17" class="t-mono">CAM 02</text>
      <circle cx="250" cy="12" r="3" fill="#F43F5E" filter="url(#c-rglow)"/>

      <rect y="76" width="126" height="68" rx="5" fill="#111A2E"/>
      <path d="M0 144 L40 104 H86 L126 144 Z" fill="rgba(148,178,255,.12)"/>
      <rect x="40" y="96" width="26" height="12" rx="2" class="ac" opacity=".55"/>
      <rect x="8" y="84" width="38" height="12" rx="3" fill="rgba(0,0,0,.5)"/><text x="12" y="93" class="t-mono">CAM 03</text>

      <rect x="134" y="76" width="126" height="68" rx="5" fill="#111A2E"/>
      <rect x="152" y="100" width="90" height="30" rx="4" fill="rgba(148,178,255,.1)"/>
      <rect x="180" y="104" width="22" height="22" rx="3" fill="none" class="stk" stroke-width="1.5" filter="url(#c-glow)"/>
      <rect x="142" y="84" width="38" height="12" rx="3" fill="rgba(0,0,0,.5)"/><text x="146" y="93" class="t-mono">CAM 04</text>
    </g>
    <rect x="138" y="196" width="24" height="18" fill="#5B657A"/><rect x="112" y="214" width="76" height="7" rx="3.5" fill="#8892A6"/>
  </g>

  <!-- регистратор -->
  <g transform="translate(300 300)" filter="url(#c-sh)">
    <rect width="150" height="40" rx="9" class="glass2"/>
    <circle cx="18" cy="20" r="3" fill="#34D399"/><circle cx="30" cy="20" r="3" class="ac" filter="url(#c-glow)"/>
    <text x="134" y="24" text-anchor="end" class="t-mono">NVR · 8CH</text>
  </g>

  <!-- статус записи -->
  <g transform="translate(470 304)" filter="url(#c-sh)">
    <rect width="150" height="58" rx="14" class="glass"/>
    <circle cx="26" cy="29" r="7" fill="#F43F5E" filter="url(#c-rglow)"/>
    <text x="44" y="26" class="t-strong-s">Запись идёт</text>
    <text x="44" y="43" class="t-muted">архив 30 дней</text>
  </g>

  <!-- телефон с доступом -->
  <g transform="translate(560 78)" filter="url(#c-sh)">
    <rect width="58" height="104" rx="12" class="glass2"/>
    <rect x="6" y="12" width="46" height="34" rx="4" fill="#111A2E"/>
    <path d="M6 40 L20 30 L32 36 L52 24 V46 H6 Z" fill="rgba(148,178,255,.14)"/>
    <rect x="10" y="54" width="38" height="5" rx="2.5" class="ln2"/>
    <rect x="10" y="64" width="28" height="5" rx="2.5" class="ln"/>
    <rect x="10" y="80" width="38" height="12" rx="6" class="ac"/>
  </g>
</svg>
