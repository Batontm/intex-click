<svg class="art" viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
  <defs>
    <radialGradient id="d-g1" cx="30%" cy="35%" r="55%"><stop offset="0" style="stop-color:var(--warm);stop-opacity:.22"/><stop offset="1" style="stop-color:var(--warm);stop-opacity:0"/></radialGradient>
    <radialGradient id="d-g2" cx="90%" cy="80%" r="60%"><stop offset="0" style="stop-color:var(--accent-2);stop-opacity:.38"/><stop offset="1" style="stop-color:var(--accent-2);stop-opacity:0"/></radialGradient>
    <filter id="d-wglow" x="-80%" y="-80%" width="260%" height="260%"><feDropShadow dx="0" dy="0" stdDeviation="6" style="flood-color:var(--warm)" flood-opacity=".8"/></filter>
    <filter id="d-glow" x="-80%" y="-80%" width="260%" height="260%"><feDropShadow dx="0" dy="0" stdDeviation="4" style="flood-color:var(--accent)" flood-opacity=".9"/></filter>
    <filter id="d-sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000" flood-opacity=".6"/></filter>
    <pattern id="d-grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="rgba(148,178,255,.06)"/></pattern>
  </defs>
  <rect width="640" height="400" class="bg"/>
  <rect width="640" height="400" fill="url(#d-grid)"/>
  <rect width="640" height="400" fill="url(#d-g1)"/>
  <rect width="640" height="400" fill="url(#d-g2)"/>

  <!-- окно браузера: сайт не открывается -->
  <g transform="translate(40 40)" filter="url(#d-sh)">
    <rect width="356" height="236" rx="14" class="glass"/>
    <circle cx="20" cy="16" r="4.5" fill="#FF5F57"/><circle cx="35" cy="16" r="4.5" fill="#FEBC2E"/><circle cx="50" cy="16" r="4.5" fill="#28C840"/>
    <rect x="96" y="7" width="190" height="18" rx="9" class="ln"/>
    <text x="191" y="20" text-anchor="middle" class="t-muted">intex.click</text>
    <line x1="0" y1="32" x2="356" y2="32" class="hair"/>
    <g transform="translate(178 104)" filter="url(#d-wglow)">
      <circle r="34" fill="rgba(255,122,61,.14)" style="stroke:var(--warm)" stroke-width="2.5"/>
      <path d="M0 -15 V5" style="stroke:var(--warm)" stroke-width="5" stroke-linecap="round"/>
      <circle cy="16" r="3.4" class="wm"/>
    </g>
    <text x="178" y="172" text-anchor="middle" class="t-title">Сайт недоступен</text>
    <text x="178" y="196" text-anchor="middle" class="t-mono" style="font-size:10px">NS: verification-hold.suspended</text>
  </g>

  <!-- таймлайн 15 дней -->
  <g transform="translate(40 300)">
    <rect width="356" height="60" rx="14" class="glass2"/>
    <text x="16" y="22" class="t-strong-s">Подтвердить email владельца</text>
    <text x="340" y="22" text-anchor="end" class="t-muted">15 дней</text>
    <g transform="translate(16 36)">
      <rect width="324" height="8" rx="4" class="ln"/>
      <rect width="324" height="8" rx="4" class="ac" opacity=".85"/>
      <rect x="292" width="32" height="8" rx="4" class="wm"/>
      <circle cx="324" cy="4" r="6" class="wm" filter="url(#d-wglow)"/>
    </g>
  </g>

  <!-- письмо от регистратора -->
  <g transform="translate(412 76)" filter="url(#d-sh)">
    <rect width="200" height="150" rx="14" class="glass" style="stroke:var(--accent);stroke-opacity:.45"/>
    <rect x="16" y="16" width="30" height="22" rx="5" class="ac2" opacity=".9"/>
    <path d="M18 19 L31 29 L44 19" fill="none" stroke="#04101F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity=".6"/>
    <text x="56" y="25" class="t-strong-s">Регистратор</text>
    <text x="56" y="39" class="t-muted">подтвердите контакты</text>
    <rect x="16" y="56" width="168" height="5" rx="2.5" class="ln"/>
    <rect x="16" y="67" width="140" height="5" rx="2.5" class="ln"/>
    <rect x="16" y="78" width="152" height="5" rx="2.5" class="ln"/>
    <rect x="16" y="100" width="168" height="32" rx="16" class="ac" filter="url(#d-glow)"/>
    <text x="100" y="120.5" text-anchor="middle" style="fill:#020617;font-size:12.5px;font-weight:700">Подтвердить email</text>
  </g>

  <!-- результат -->
  <g transform="translate(410 246)" filter="url(#d-sh)">
    <rect width="214" height="56" rx="14" class="glass" style="stroke:#34D399;stroke-opacity:.5"/>
    <circle cx="28" cy="28" r="15" fill="rgba(52,211,153,.18)"/>
    <path d="M21 28.5l5 5 9-10" fill="none" stroke="#34D399" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="52" y="25" class="t-strong">Домен активен</text>
    <text x="52" y="42" class="t-ok">сайт и почта работают</text>
  </g>
</svg>
