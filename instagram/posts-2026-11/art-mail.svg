<svg class="art" viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
  <defs>
    <radialGradient id="e-g1" cx="50%" cy="45%" r="50%"><stop offset="0" style="stop-color:var(--accent);stop-opacity:.30"/><stop offset="1" style="stop-color:var(--accent);stop-opacity:0"/></radialGradient>
    <radialGradient id="e-g2" cx="100%" cy="100%" r="55%"><stop offset="0" style="stop-color:var(--warm);stop-opacity:.26"/><stop offset="1" style="stop-color:var(--warm);stop-opacity:0"/></radialGradient>
    <linearGradient id="e-env" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--accent)"/><stop offset="1" style="stop-color:var(--accent-2)"/></linearGradient>
    <filter id="e-glow" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="0" stdDeviation="6" style="flood-color:var(--accent)" flood-opacity=".85"/></filter>
    <filter id="e-sglow" x="-80%" y="-80%" width="260%" height="260%"><feDropShadow dx="0" dy="0" stdDeviation="3" style="flood-color:var(--accent)" flood-opacity=".95"/></filter>
    <filter id="e-sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000" flood-opacity=".6"/></filter>
    <pattern id="e-grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="rgba(148,178,255,.06)"/></pattern>
  </defs>
  <rect width="640" height="400" class="bg"/>
  <rect width="640" height="400" fill="url(#e-grid)"/>
  <rect width="640" height="400" fill="url(#e-g1)"/>
  <rect width="640" height="400" fill="url(#e-g2)"/>

  <!-- форма на сайте -->
  <g transform="translate(34 70)" filter="url(#e-sh)">
    <rect width="176" height="232" rx="14" class="glass"/>
    <text x="18" y="30" class="t-title">Заявка</text>
    <rect x="18" y="46" width="140" height="28" rx="7" class="glass2"/><rect x="30" y="57" width="58" height="6" rx="3" class="ln2"/>
    <rect x="18" y="82" width="140" height="28" rx="7" class="glass2"/><rect x="30" y="93" width="74" height="6" rx="3" class="ln2"/>
    <rect x="18" y="118" width="140" height="52" rx="7" class="glass2"/><rect x="30" y="130" width="96" height="5" rx="2.5" class="ln"/><rect x="30" y="141" width="70" height="5" rx="2.5" class="ln"/>
    <rect x="18" y="184" width="140" height="30" rx="15" class="ac" filter="url(#e-sglow)"/>
    <text x="88" y="203.5" text-anchor="middle" style="fill:#020617;font-size:12px;font-weight:700">Отправить</text>
  </g>

  <!-- путь письма -->
  <path d="M214 186 C 250 186, 252 186, 272 186" fill="none" class="stk" stroke-width="2.2" stroke-dasharray="6 7"/>

  <!-- конверт -->
  <g transform="translate(274 132)" filter="url(#e-glow)">
    <rect width="112" height="78" rx="12" fill="url(#e-env)"/>
    <path d="M8 12 L56 46 L104 12" fill="none" stroke="#04101F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/>
  </g>
  <text x="330" y="236" text-anchor="middle" class="t-status">SMTP · SSL</text>

  <!-- развилка -->
  <path d="M390 160 C 430 160, 430 102, 470 102" fill="none" stroke="#34D399" stroke-width="2.2" stroke-dasharray="6 7"/>
  <path d="M390 190 C 430 190, 430 262, 470 262" fill="none" style="stroke:var(--warm)" stroke-width="2.2" stroke-dasharray="3 7" opacity=".7"/>

  <!-- входящие -->
  <g transform="translate(470 66)" filter="url(#e-sh)">
    <rect width="150" height="72" rx="14" class="glass" style="stroke:#34D399;stroke-opacity:.5"/>
    <circle cx="28" cy="36" r="15" fill="rgba(52,211,153,.18)"/>
    <path d="M21 36.5l5 5 9-10" fill="none" stroke="#34D399" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="52" y="32" class="t-strong">Входящие</text>
    <text x="52" y="50" class="t-ok">доставлено</text>
  </g>

  <!-- спам -->
  <g transform="translate(470 226)" opacity=".85">
    <rect width="150" height="72" rx="14" class="glass" style="stroke:var(--warm);stroke-opacity:.45"/>
    <circle cx="28" cy="36" r="15" fill="rgba(255,122,61,.16)"/>
    <path d="M22 30l12 12M34 30l-12 12" fill="none" style="stroke:var(--warm)" stroke-width="2.4" stroke-linecap="round"/>
    <text x="52" y="32" class="t-strong">Спам</text>
    <text x="52" y="50" class="t-muted">без SPF и DKIM</text>
  </g>

  <!-- записи DNS -->
  <g transform="translate(232 278)">
    <rect width="66" height="28" rx="14" class="glass2" style="stroke:var(--accent);stroke-opacity:.5"/><text x="33" y="18.5" text-anchor="middle" class="t-status">SPF</text>
    <rect x="76" width="66" height="28" rx="14" class="glass2" style="stroke:var(--accent);stroke-opacity:.5"/><text x="109" y="18.5" text-anchor="middle" class="t-status">DKIM</text>
    <rect x="152" width="74" height="28" rx="14" class="glass2" style="stroke:var(--accent);stroke-opacity:.5"/><text x="189" y="18.5" text-anchor="middle" class="t-status">DMARC</text>
  </g>
</svg>
